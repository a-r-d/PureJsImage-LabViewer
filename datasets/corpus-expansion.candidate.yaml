schemaVersion: 1
status: research-only-candidates
notes:
  - Do not merge entries into the enabled corpus until exact file URLs, selected paths, SHA-256, license, attribution, and hosting decisions are verified.
  - Do not assume a paper or code repository license covers the data files.

candidates:
  - id: nist-sem-detection-limits-expanded
    modality: SEM
    task: threshold and segmentation robustness under contrast/noise
    landingPage: https://doi.org/10.18434/mds2-3838
    desiredSubset: small representative images spanning noise and contrast conditions
    expectedWorkflows: [display, threshold-method-comparison, segmentation-metrics]

  - id: zenodo-indentation-sem-masks
    modality: SEM
    task: indentation segmentation and ground-truth overlay
    landingPage: https://doi.org/10.5281/zenodo.7639190
    desiredSubset: diverse instruments, brightness, contrast, and masks
    expectedWorkflows: [open, overlay, threshold, segmentation-comparison]

  - id: tem-nanoparticle-labels
    modality: TEM
    task: nanoparticle counting and size distribution
    desiredSubset: calibrated image plus instance or semantic mask
    expectedWorkflows: [threshold, watershed, connected-components, size-distribution]

  - id: sem-additive-manufacturing-phases
    modality: SEM
    task: phase/particle segmentation
    desiredSubset: several magnifications and masks
    expectedWorkflows: [background-correction, threshold, morphology, phase-fraction]

  - id: afm-calibrated-height-field
    modality: AFM
    task: leveling, roughness, grains, line profile
