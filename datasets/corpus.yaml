schemaVersion: 1

policies:
  cacheDirectory: .cache/scientific-corpus
  refuseUnknownLicense: true
  refuseMissingIntegrity: true
  maximumArchiveFiles: 10000
  maximumExtractedBytes: 10737418240
  allowedSchemes: [https]

entries:
  - id: generated-materials-shapes-v1
    status: enabled
    tier: generated
    title: Deterministic calibrated materials-analysis shapes
    modalities: [synthetic, SEM-like]
    formats: [png, mrc, gsf, envi, cbf, tiff]
    source:
      acquisition: generated
      generator: tooling/corpus/generate-materials-fixtures.ts
      seed: 20260813
    license:
      id: CC0-1.0
      url: https://creativecommons.org/publicdomain/zero/1.0/
      attribution: Generated by this project.
      verifiedAt: 2026-08-13
    tests:
      - open
      - metadata
      - calibration
      - roi-statistics
      - line-profile
      - threshold
      - connected-components
      - project-replay
      - visual

  - id: nist-sem-segmentation-detection-limits
    status: candidate
    tier: ci
    title: Detection Limits for SEM Image Segmentation
    modalities: [SEM, simulated]
    formats: [repository-archive]
    source:
      acquisition: nist-pdr
      landingPage: https://doi.org/10.18434/mds2-3838
      version: 1.0.3
    license:
      id: LicenseRef-NIST-Public-Data
      url: https://www.nist.gov/open/license
      attribution: Bajcsy, Sathe, and Vladar, NIST, Detection Limits for SEM Image Segmentation.
      verifiedAt: 2026-08-13
    integrity:
      status: pin-selected-files-before-enabling
    selection:
      strategy: choose-small-representative-noise-and-contrast-subset
    tests:
      - open
      - threshold-robustness
      - segmentation-metrics
      - visual
      - agent-analysis

  - id: zenodo-indentation-sem-subset
    status: candidate
    tier: ci
    title: Indention mark segmentation data, curated subset
    modalities: [SEM]
