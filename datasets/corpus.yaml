      acquisition: zenodo-record
      landingPage: https://doi.org/10.5281/zenodo.7639190
      recordId: 7639190
      archives:
        - name: images.tar.gz
          expectedBytes: 2200000000
          integrity:
            algorithm: md5
            digest: 61df52b5dd72c48d8c4febc0932d157b
        - name: masks.tar.gz
          expectedBytes: 7600000
          integrity:
            algorithm: md5
            digest: 047f601bdd2b5526fa8c50ea1b4c5f52
    license:
