name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm deploy:dry-run

  browser-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Science Playwright (Chromium)
        env:
          E2E_EXPECTED_PROJECTS: chromium
        run: pnpm test:e2e:science --project=chromium
      - name: Geo Playwright (Chromium)
        if: ${{ !cancelled() }}
        env:
          E2E_EXPECTED_PROJECTS: chromium
        run: pnpm test:e2e:geo --project=chromium
      - name: Upload science Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-science-test-results
          path: |
            test-results/science/
            playwright-report/
          retention-days: 7
      - name: Upload geo Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-geo-test-results
          path: |
            test-results/geo/
            playwright-report-geo/
          retention-days: 7

  browser-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - name: Science Playwright (Firefox, WebKit)
        env:
          E2E_EXPECTED_PROJECTS: firefox,webkit
        run: pnpm test:e2e:science --project=firefox --project=webkit
      - name: Geo Playwright (Firefox, WebKit)
        if: ${{ !cancelled() }}
        env:
          E2E_EXPECTED_PROJECTS: firefox,webkit
        run: pnpm test:e2e:geo --project=firefox --project=webkit
      - name: Upload science Firefox/WebKit failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-webkit-science-test-results
          path: |
            test-results/science/
            playwright-report/
          retention-days: 7
      - name: Upload geo Firefox/WebKit failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-webkit-geo-test-results
          path: |
            test-results/geo/
            playwright-report-geo/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:static
      - run: pnpm audit --prod --audit-level=high
